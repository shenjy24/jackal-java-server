services:
  mysql-service:
    image: mysql:8.4.10
    container_name: mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"

    environment:
      # 容器操作系统级别的时区设置
      TZ: Asia/Shanghai
      # Root 账号密码
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}

    volumes:
      # 核心数据持久化目录
      - mysql-data:/var/lib/mysql
      # 挂载自定义配置文件（增加 :ro 设为只读，提升安全性）
      - ./conf.d:/etc/mysql/conf.d:ro
      # 挂载 MySQL 错误日志和慢查询日志，便于宿主机排查与留存
      - ./logs:/var/log/mysql
      # 首次启动时的初始化 SQL 脚本目录（仅在数据目录为空时执行一次）
      - ./init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      # 健康检查：仅在检查命令内临时注入密码，避免 MYSQL_PWD 干扰 MySQL 首次初始化
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -uroot --silent"]
      interval: 10s       # 每 10 秒检查一次
      timeout: 5s         # 检查超时时间 5 秒
      retries: 5          # 连续 5 次失败则判定为不健康
      start_period: 30s   # 给 MySQL 启动留出 30 秒宽限期，期间检查失败不计入错误

    # 容器停止宽限期：给 InnoDB 缓冲池足够的时间将脏页刷入磁盘，避免下次启动时进行漫长的崩溃恢复
    stop_grace_period: 60s

    deploy:
      resources:
        # 硬限制 (上限)：当 MySQL 内存飙升碰到 512M 时，Docker 会直接 Kill 重启它，保护宿主机不死
        limits:
          memory: ${APP_MEMORY_LIMIT:-512M}
        # 软限制 (保底)：告知系统此容器日常运行约需 215M，方便集群调度
        reservations:
          memory: ${APP_MEMORY_RESERVATION:-215M}

    logging:
      driver: "json-file"
      options:
        max-size: "50m"   # 单个日志文件最大 50M
        max-file: "3"     # 最多保留 3 个旧日志文件
        compress: "true"  # 压缩旧日志，节省磁盘空间

volumes:
  mysql-data:
    name: mysql-data
