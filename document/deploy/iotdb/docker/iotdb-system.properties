#
# IoTDB 单机版系统配置。
# 该文件由 docker-compose 直接挂载到 /iotdb/conf/iotdb-system.properties。
#

####################
### 集群基础配置
####################

cluster_name=defaultCluster

####################
### 种子 ConfigNode 配置
####################

cn_seed_config_node=127.0.0.1:10710
dn_seed_config_node=127.0.0.1:10710

####################
### 节点 RPC 与内部通信配置
####################

# ConfigNode 单机内部通信配置。
cn_internal_address=127.0.0.1
cn_internal_port=10710
cn_consensus_port=10720

# DataNode 对外 RPC 地址。Docker bridge 网络下保持 0.0.0.0，客户端连接宿主机 IP:6667。
dn_rpc_address=0.0.0.0
dn_rpc_port=6667

# DataNode 单机内部通信配置。
dn_internal_address=127.0.0.1
dn_internal_port=10730
dn_mpp_data_exchange_port=10740
dn_schema_region_consensus_port=10750
dn_data_region_consensus_port=10760

####################
### 副本配置
####################

schema_replication_factor=1
data_replication_factor=1

####################
### 指标端口配置
####################

cn_metric_reporter_list=PROMETHEUS
dn_metric_reporter_list=PROMETHEUS
cn_metric_level=IMPORTANT
dn_metric_level=IMPORTANT
cn_metric_prometheus_reporter_port=9091
dn_metric_prometheus_reporter_port=9092

####################
### 机械盘写入链路调优
####################

# 机械盘下限制 flush 并发，避免多个 flush 同时打满磁盘 IO。
flush_thread_count=1
io_task_queue_size_for_flushing=4

# 机械盘下限制 compaction 并发，减少后台合并任务抢占实时写入资源。
compaction_thread_count=1
sub_compaction_thread_count=1
compaction_schedule_thread_num=1

# 机械盘下限制 compaction 读写吞吐，降低磁盘尖刺和 GC 间接压力。
compaction_write_throughput_mb_per_sec=8
compaction_read_throughput_mb_per_sec=16
