services:
  iotdb-service:
    image: apache/iotdb:2.0.6-standalone
    hostname: iotdb
    container_name: iotdb
    # 异常退出或宿主机重启后自动拉起
    restart: unless-stopped
    ports:
      - "6667:6667"

    environment:
      # ConfigNode 内部通信
      cn_internal_address: 127.0.0.1
      cn_internal_port: "10710"
      cn_consensus_port: "10720"
      cn_seed_config_node: 127.0.0.1:10710

      # DataNode 内部通信及 RPC 服务
      # bridge 网络下用于容器内监听，不建议写宿主机 IP
      dn_rpc_address: ${DN_RPC_ADDRESS:-0.0.0.0}
      dn_rpc_port: "6667"
      # 单机内部通信
      dn_internal_address: 127.0.0.1
      dn_internal_port: "10730"
      dn_mpp_data_exchange_port: "10740"
      dn_schema_region_consensus_port: "10750"
      dn_data_region_consensus_port: "10760"
      dn_seed_config_node: 127.0.0.1:10710

      TZ: Asia/Shanghai
      # IoTDB 内存预算，由启动脚本分配给堆和直接内存
      # DataNode
      IOTDB_JMX_OPTS: "${APP_IOTDB_JMX_OPTS:--Xms256M -Xmx384M -XX:MaxDirectMemorySize=128M}"
      # ConfigNode
      CONFIGNODE_JMX_OPTS: "${APP_CONFIGNODE_JMX_OPTS:--Xms128M -Xmx192M -XX:MaxDirectMemorySize=64M}"

    volumes:
      - iotdb-data:/iotdb/data # 持久化时序数据和 WAL
      # 如需高级调参，请挂载与镜像版本一致的完整配置目录
      # - ./conf:/iotdb/conf
      - ./logs:/iotdb/logs # 日志映射到宿主机，便于排查

    healthcheck:
      # 轻量探测 RPC 端口，避免启动 CLI
      test: [ "CMD", "bash", "-c", "cat /dev/null > /dev/tcp/localhost/6667" ]
      interval: 15s     # 探测间隔
      timeout: 5s       # 单次超时
      retries: 5        # 连续失败阈值
      start_period: 60s # 冷启动宽限期

    # 预留刷盘和 WAL 清理时间，减少异常恢复开销
    stop_grace_period: 60s

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-1G}
        reservations:
          memory: ${APP_MEMORY_RESERVATION:-768M}

    logging:
      driver: "json-file"
      options:
        max-size: "50m"  # 单文件上限
        max-file: "3"    # 最多保留 3 个文件
        compress: "true" # 压缩轮转日志

volumes:
  iotdb-data:
    name: iotdb-data
