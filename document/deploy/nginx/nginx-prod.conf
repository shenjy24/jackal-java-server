map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 两个后端服务：C 端(service-client) 与 管理后台(service-admin)
upstream service_client {
    server 127.0.0.1:18881;
}
upstream service_admin {
    server 127.0.0.1:18882;
}

# 两个前端页面：C 端页面挂载在 /，管理后台页面挂载在 /admin/
upstream frontend_client {
    server 127.0.0.1:30000;
}
upstream frontend_admin {
    server 127.0.0.1:30001;
}

server {
    listen 80;
    server_name icebox.missuai.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name icebox.missuai.com;

    # ================= SSL =================
    ssl_certificate      /home/tech/cert/missuai.com.pem;
    ssl_certificate_key  /home/tech/cert/missuai.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ================= 安全 =================
    client_max_body_size 50m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ================= Gzip =================
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ================= 管理后台页面 (/admin/) 与接口 (/admin/api/**) =================
    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/api/ {
        proxy_pass http://service_admin/;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location ^~ /admin/ {
        proxy_pass http://frontend_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ================= C 端页面 (/) 与接口 (/api/**) =================
    location /api/ {
        proxy_pass http://service_client/;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://frontend_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
